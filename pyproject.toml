[project]
name = "fxmoney"
version = "0.1.0"
description = "Projeto voltado para area financeira"
authors = [
    {name = "Michael Borges",email = "michaelborges21@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "requests (>=2.34.2,<3.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]
